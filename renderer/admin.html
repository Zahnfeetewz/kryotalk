<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kryotalk - Admin-Panel</title>
<link rel="stylesheet" href="app.css" />
</head>
<body data-theme="dark">
  <div class="layout">
    <div class="channel-list" style="width:220px">
      <div class="server-header">Admin-Panel</div>
      <div class="channel-group">
        <div class="channel active">Alle Nutzer</div>
      </div>
      <div style="flex:1"></div>
      <div class="user-panel">
        <button id="back-btn" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px">← Zurück zur App</button>
      </div>
    </div>
    <div class="chat-area">
      <div class="chat-header">
        <span id="admin-header-title">Alle Nutzer</span>
        <input class="admin-search" id="admin-search" placeholder="Suchen…" style="width:200px;padding:6px 10px;border-radius:4px;border:none;background:var(--bg-input);color:var(--text-main);font-size:12px" />
      </div>
      <div style="padding:12px 16px;font-size:13px;color:var(--text-muted)" id="admin-count"></div>
      <div style="padding:0 16px;overflow-y:auto;flex:1" id="admin-list"></div>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="translations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelector('.server-header').textContent = t('navAdminPanel');
      document.getElementById('admin-header-title').textContent = t('allUsers');
      document.querySelector('.channel.active').textContent = t('allUsers');
      document.getElementById('back-btn').textContent = '← ' + t('backToApp');
      document.getElementById('admin-search').placeholder = t('search');
    });
  </script>
  <script>
    function toFileUrl(p) { return window.api?.toFileUrl?.(p) || (p ? 'file://' + p.replace(/\\/g, '/') : ''); }
    function defaultAvatar(l) { const s = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="#5865f2"/><text x="20" y="26" font-size="16" fill="#fff" text-anchor="middle" font-family="sans-serif">'+l+'</text></svg>'; return 'data:image/svg+xml;base64,' + btoa(s); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    const currentUserId = localStorage.getItem('currentUserId');

    let allUsers = [];
    async function load() {
      allUsers = await window.api.adminGetAllUsers();
      render(allUsers);
    }
    function render(users) {
      document.getElementById('admin-count').textContent = users.length + ' ' + t('usersRegistered');
      const list = document.getElementById('admin-list');
      list.innerHTML = '';
      users.forEach(u => {
        const av = u.avatarPath ? toFileUrl(u.avatarPath) : defaultAvatar((u.username||'?')[0].toUpperCase());
        const cr = new Date(u.createdAt).toLocaleDateString(getLocale(),{day:'2-digit',month:'long',year:'numeric'});
        const d = document.createElement('div');
        d.className = 'admin-user-card';
        d.innerHTML = '<img class="admin-user-avatar" src="'+av+'" /><div class="admin-user-info"><div class="admin-user-name">'+esc(u.username)+' <span class="rarity-tag rarity-'+u.rarityKey+'" style="font-size:10px">'+u.rarityLabel+'</span>'+(u.is_owner?' <span style="color:#f0b232;font-size:10px;font-weight:700">OWNER</span>':u.is_admin?' <span style="color:#da373c;font-size:10px">ADMIN</span>':'')+'</div><div style="font-size:12px;color:var(--text-muted)">IP: '+(u.lastIP||'—')+' · '+t('registered')+': '+cr+'</div>'+(u.aboutMe?'<div style="font-size:12px;color:var(--text-muted);font-style:italic;margin-top:2px">"'+esc(u.aboutMe)+'"</div>':'')+'<div style="margin-top:6px;display:flex;gap:6px">'+(u.is_owner?'':'<button class="btn-small" data-act="admin" data-uid="'+u.id+'">'+(u.is_admin?t('revokeAdmin'):t('makeAdmin'))+'</button>')+'<button class="btn-small-danger" data-act="del" data-uid="'+u.id+'">'+t('delete')+'</button></div></div>';
        list.appendChild(d);
      });
      list.querySelectorAll('[data-act]').forEach(b => {
        b.onclick = async () => {
          if (b.dataset.act==='admin') { await window.api.adminToggleAdmin(b.dataset.uid, currentUserId); load(); }
          else if (b.dataset.act==='del' && confirm(t('confirmDeleteUser'))) { await window.api.adminDeleteUser(b.dataset.uid, currentUserId); load(); }
        };
      });
    }
    document.getElementById('admin-search').oninput = e => {
      const q = e.target.value.trim().toLowerCase();
      render(q ? allUsers.filter(u => u.username.toLowerCase().includes(q)) : allUsers);
    };
    document.getElementById('back-btn').onclick = () => window.location.href = 'app.html';
    load();
  </script>
</body>
</html>
